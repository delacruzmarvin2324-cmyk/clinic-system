services:
  - type: web
    name: clinic-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && python manage.py provision_initial_doctor && gunicorn clinic_system.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/auth/challenge/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,0.0.0.0,clinic-system-w383.onrender.com"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "https://clinic-system-w383.onrender.com,http://localhost:8080,http://127.0.0.1:8080"
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString

databases:
  - name: clinic-db
    databaseName: clinic
    user: clinic
